{# Shared line icons. Usage: {% from '_icons.html' import icon %} then {{ icon('phone') }} #}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'phone' %}<path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
    {% elif name == 'chat' %}<path d="M21 12a9 9 0 0 1-13.2 8L3 21l1.2-4.6A9 9 0 1 1 21 12z"/>
    {% elif name == 'pin' %}<path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>
    {% elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
    {% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% elif name == 'check' %}<path d="m5 12.500 4.500 4.500L19 7.500"/>
    {% elif name == 'hall' %}<path d="M3 21h18M5 21V10a7 7 0 0 1 14 0v11M9 21v-6h6v6"/>
    {% elif name == 'bed' %}<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M6 10V7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3"/>
    {% elif name == 'dining' %}<path d="M7 3v7a2 2 0 0 0 2 0V3M8 11v10M5 3v6a3 3 0 0 0 2 2M17 3c-2 1-3 4-3 8h3v10"/>
    {% elif name == 'tag' %}<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.500" cy="8" r="1.200"/>
    {% elif name == 'light' %}<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.500 1 1.200 1 2.100h5c0-.9.400-1.600 1-2.100A6 6 0 0 0 12 3z"/>
    {% elif name == 'chair' %}<path d="M7 3v18M17 3v18M7 13h10M7 8h10"/>
    {% elif name == 'water' %}<path d="M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>
    {% elif name == 'parking' %}<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3"/>
    {% elif name == 'fan' %}<circle cx="12" cy="12" r="1.500"/><path d="M12 10c-1-4 0-7 3-7s2 5-3 7zM14 12c4-1 7 0 7 3s-5 2-7-3zM12 14c1 4 0 7-3 7s-2-5 3-7zM10 12c-4 1-7 0-7-3s5-2 7 3z"/>
    {% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
    {% elif name == 'moon' %}<path d="M20 14.500A8 8 0 1 1 9.500 4a6.500 6.500 0 0 0 10.500 10.500z"/>
    {% endif %}
</svg>
{% endmacro %}
